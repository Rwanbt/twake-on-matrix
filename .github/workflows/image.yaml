on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - "main"

name: Build Docker images

permissions:
  pull-requests: read
  contents: read

jobs:
  # Build each architecture on native GitHub runners. The previous combined
  # amd64+arm64 Buildx job ran Flutter, Rust and Brotli under QEMU for arm64,
  # consuming hours without producing a CI verdict.
  build_dev_platform:
    name: Validate image (${{ matrix.arch }})
    if: github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/twake-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr

      - name: Validate full image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          outputs: type=cacheonly
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=twake-web-${{ matrix.arch }}
          cache-to: type=gha,scope=twake-web-${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Preserve the existing required check name. Its success requires BOTH
  # native architecture builds to complete successfully; skips/failures fail.
  build_dev_image:
    name: Build development image
    if: always() && (github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name == 'main'))
    needs: build_dev_platform
    runs-on: ubuntu-24.04
    steps:
      - name: Require both native builds to pass
        run: test "${{ needs.build_dev_platform.result }}" = "success"

  build_release_image:
    name: Build release image
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ${{ github.repository_owner }}/twake-web
            ghcr.io/${{ github.repository_owner }}/twake-web
          tags: |
            type=ref,event=tag
            type=raw,value=release

      - name: Compute Sentry release version
        id: sentry_version
        # Strip the leading 'v' from the git tag (e.g. v2.19.7 → 2.19.7)
        run: echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: "linux/amd64,linux/arm64"
          cache-from: |
            type=gha
          cache-to: |
            type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SENTRY_DIST defaults to the build number from pubspec.yaml inside the build
          build-args: |
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_RELEASE=${{ steps.sentry_version.outputs.release }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ENVIRONMENT=${{ secrets.SENTRY_ENVIRONMENT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
