on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - "main"

name: Build Docker images

permissions:
  pull-requests: read
  contents: read

jobs:
  build_dev_image:
    name: Build development image
    if: github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/twake-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr

      # Branch pushes validate the actual multi-architecture Docker build but
      # MUST NOT publish without explicit release authorization or registry credentials.
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: "linux/amd64,linux/arm64"
          cache-from: |
            type=gha
          cache-to: |
            type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_release_image:
    name: Build release image
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository_owner }}/twake-web
            ghcr.io/${{ github.repository_owner }}/twake-web
          tags: |
            type=ref,event=tag
            type=raw,value=release

      - name: Compute Sentry release version
        id: sentry_version
        # Strip the leading 'v' from the git tag (e.g. v2.19.7 → 2.19.7)
        run: echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: "linux/amd64,linux/arm64"
          cache-from: |
            type=gha
          cache-to: |
            type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SENTRY_DIST defaults to the build number from pubspec.yaml inside the build
          build-args: |
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_RELEASE=${{ steps.sentry_version.outputs.release }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ENVIRONMENT=${{ secrets.SENTRY_ENVIRONMENT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
